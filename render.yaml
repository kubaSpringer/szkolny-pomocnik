services:
  - type: web
    name: szkolny-pomocnik
    runtime: node
    plan: free
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: szkolny-pomocnik-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false

databases:
  - name: szkolny-pomocnik-db
    databaseName: szkolny_pomocnik
    plan: basic-256mb
