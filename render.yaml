# Web service only. The database is hosted on Neon (https://neon.tech).
services:
  - type: web
    name: szkolny-pomocnik
    runtime: node
    plan: free
    # Keep the app close to the Neon database (AWS eu-central-1 = Frankfurt).
    region: frankfurt
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Neon connection string (Neon console -> Connect), must include ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
